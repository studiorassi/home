<script>
  // ============================================================
  // CONFIGURAÇÕES
  // ============================================================
  const API_BASE_URL = 'https://api-studiorassi.onrender.com';
  const PHOTO_PRICE = 15.00;
  const VIDEO_PRICE = 40.00;

  // 🔥 LINKS DO MERCADO PAGO
  const MP_URL_PHOTO = 'https://mpago.la/1Poyp16';
  const MP_URL_VIDEO = 'https://mpago.la/2xmQMfL';

  // ============================================================
  // DADOS
  // ============================================================
  let allMedia = [];
  let totalItems = 0;
  let currentModalIndex = 0;
  let imagesLoaded = 0;
  let currentFilter = 'all';
  let downloadedItems = JSON.parse(localStorage.getItem('downloadedMedia') || '[]');
  let pendingPurchase = null;

  // ============================================================
  // DOM ELEMENTS
  // ============================================================
  const grid = document.getElementById('galleryGrid');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalImage = document.getElementById('modalImage');
  const modalVideoContainer = document.getElementById('modalVideoContainer');
  const modalVideo = document.getElementById('modalVideo');
  const modalVideoSource = document.getElementById('modalVideoSource');
  const modalBuyBtn = document.getElementById('modalBuyBtn');
  const modalConfirmPaymentBtn = document.getElementById('modalConfirmPaymentBtn');
  const modalPriceDisplay = document.getElementById('modalPriceDisplay');
  const modalPriceStrong = document.getElementById('modalPriceStrong');
  const modalMediaType = document.getElementById('modalMediaType');
  const paymentStatus = document.getElementById('paymentStatus');
  const progressContainer = document.getElementById('progressContainer');
  const progressFill = document.getElementById('progressFill');
  const loadedCount = document.getElementById('loadedCount');
  const totalCount = document.getElementById('totalCount');
  const modalProgress = document.getElementById('modalProgress');
  const modalProgressFill = document.getElementById('modalProgressFill');
  const modalProgressLabel = document.getElementById('modalProgressLabel');
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  const navbar = document.getElementById('mainNavbar');

  // ============================================================
  // FUNÇÕES AUXILIARES
  // ============================================================
  function updateDownloadedDisplay() {
    const count = downloadedItems.length;
    const displayElements = [
      document.getElementById('desktopDownloadedDisplay'),
      document.getElementById('mobileDownloadedDisplay')
    ];
    displayElements.forEach(el => {
      if (el) el.textContent = `${count} / ${totalItems}`;
    });
  }

  function updateModalButtons(isDownloaded = false) {
    if (!modalBuyBtn || !modalConfirmPaymentBtn) return;
    
    if (isDownloaded) {
      modalBuyBtn.className = 'modal-btn-buy downloaded';
      modalBuyBtn.innerHTML = '<i class="fas fa-check-circle"></i> JÁ BAIXADO';
      modalBuyBtn.disabled = true;
      modalConfirmPaymentBtn.style.display = 'none';
      if (paymentStatus) {
        paymentStatus.textContent = '✅ Item já baixado';
        paymentStatus.style.color = '#4CAF50';
      }
    } else {
      const item = allMedia[currentModalIndex];
      const price = item ? item.price : PHOTO_PRICE;
      modalBuyBtn.className = 'modal-btn-buy';
      modalBuyBtn.innerHTML = `<i class="fas fa-shopping-cart"></i> Comprar · R$ ${price.toFixed(2)}`;
      modalBuyBtn.disabled = false;
      modalConfirmPaymentBtn.style.display = 'flex';
      if (paymentStatus) {
        paymentStatus.textContent = '⏳ Aguardando pagamento';
        paymentStatus.style.color = '#FFD700';
      }
    }
  }

  function updateDownloadBadge(id) {
    const items = document.querySelectorAll('.watermark-item');
    items.forEach(item => {
      if (item.dataset.id === id) {
        const badge = item.querySelector('.badge-status');
        if (badge) {
          badge.className = 'badge-status downloaded';
          badge.innerHTML = '<i class="fas fa-unlock"></i> JÁ BAIXADO';
        }
      }
    });
  }

  function updatePaymentStatus(message, type = 'info') {
    if (!paymentStatus) return;
    paymentStatus.textContent = message;
    if (type === 'success') {
      paymentStatus.style.color = '#4CAF50';
    } else if (type === 'error') {
      paymentStatus.style.color = '#ff6b6b';
    } else if (type === 'warning') {
      paymentStatus.style.color = '#FFD700';
    } else {
      paymentStatus.style.color = '#7a5f5a';
    }
  }

  function updateCounters() {
    const elements = [
      document.getElementById('totalCount'),
      document.getElementById('totalCountDisplay'),
      document.getElementById('totalPhotosDisplay')
    ];
    elements.forEach(el => {
      if (el) el.textContent = totalItems;
    });
    updateDownloadedDisplay();
  }

  // ============================================================
  // GERAR CÓDIGO DE CONFIRMAÇÃO
  // ============================================================
  function gerarCodigoConfirmacao() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let codigo = '';
    for (let i = 0; i < 8; i++) {
      codigo += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return codigo;
  }

  // ============================================================
  // CARREGAR MÍDIAS
  // ============================================================
  async function loadMediaFromS3() {
    try {
      console.log('📡 Buscando lista de fotos no S3...');
      const fotosResponse = await fetch(`${API_BASE_URL}/api/gallery/list/fotos`);
      if (!fotosResponse.ok) throw new Error('Erro ao buscar lista de fotos');
      const fotosData = await fotosResponse.json();
      
      const photoFiles = fotosData.files.filter(file => 
        file.filename.endsWith('.jpg') || file.filename.endsWith('.jpeg')
      );
      
      const fotos = photoFiles.map((file, index) => {
        const filename = file.filename;
        const numMatch = filename.match(/(\d+)/);
        const num = numMatch ? numMatch[1] : String(index + 1).padStart(2, '0');
        const title = filename.replace(/\.[^.]+$/, '');
        return {
          id: `foto_${num}`,
          type: 'foto',
          key: `fotos/${filename}`,
          price: PHOTO_PRICE,
          title: title,
          thumbnail: `${API_BASE_URL}/api/gallery/view/fotos/${filename}`,
          mediaUrl: `${API_BASE_URL}/api/gallery/view/fotos/${filename}`,
          isVideo: false
        };
      });

      console.log('📡 Buscando lista de vídeos no S3...');
      const videosResponse = await fetch(`${API_BASE_URL}/api/gallery/list/videos`);
      if (!videosResponse.ok) throw new Error('Erro ao buscar lista de vídeos');
      const videosData = await videosResponse.json();
      
      const videoFiles = videosData.files.filter(file => 
        file.filename.endsWith('.mp4')
      );
      
      function createVideoPlaceholder(title) {
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
            <rect width="400" height="300" fill="#1f0510"/>
            <rect x="20" y="20" width="360" height="260" rx="10" fill="#2C0714" stroke="#D4A3B3" stroke-width="1" opacity="0.5"/>
            <circle cx="200" cy="130" r="45" fill="#D4A3B3" opacity="0.2"/>
            <polygon points="185,110 185,150 225,130" fill="#D4A3B3"/>
            <text x="200" y="210" font-family="Arial, sans-serif" font-size="16" fill="#D4A3B3" text-anchor="middle" font-weight="bold">${title}</text>
            <text x="200" y="235" font-family="Arial, sans-serif" font-size="12" fill="#7a5f5a" text-anchor="middle">🎬 Clique para assistir</text>
          </svg>
        `;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }
      
      const videos = videoFiles.map((file, index) => {
        const filename = file.filename;
        const numMatch = filename.match(/(\d+)/);
        const num = numMatch ? numMatch[1] : String(index + 1).padStart(2, '0');
        const title = filename.replace(/\.[^.]+$/, '');
        const thumbnailUrl = `${API_BASE_URL}/api/gallery/thumbnail/videos/${filename}`;
        return {
          id: `video_${num}`,
          type: 'video',
          key: `videos/${filename}`,
          price: VIDEO_PRICE,
          title: title,
          thumbnail: thumbnailUrl,
          fallbackThumbnail: createVideoPlaceholder(title),
          mediaUrl: `${API_BASE_URL}/api/gallery/view/videos/${filename}`,
          isVideo: true
        };
      });

      allMedia = [...fotos, ...videos];
      totalItems = allMedia.length;
      
      console.log(`📊 Total: ${fotos.length} fotos + ${videos.length} vídeos = ${totalItems} itens`);
      
      updateCounters();
      renderGallery();
      
    } catch (error) {
      console.error('❌ Erro ao carregar mídias:', error);
      alert('Erro ao carregar a galeria. Tente novamente.');
    }
  }

  // ============================================================
  // RENDER GALERIA
  // ============================================================
  function renderGallery() {
    if (!grid) return;
    
    const filteredItems = currentFilter === 'all' 
      ? allMedia 
      : allMedia.filter(item => item.type === currentFilter);
    
    grid.innerHTML = '';
    imagesLoaded = 0;
    
    if (!window._galleryLoaded) {
      if (progressContainer) progressContainer.style.display = 'block';
      if (progressFill) progressFill.style.width = '0%';
      if (loadedCount) loadedCount.textContent = '0';
    }

    filteredItems.forEach((item, index) => {
      const isDownloaded = downloadedItems.includes(item.id);
      const div = document.createElement('div');
      div.className = `watermark-item ${item.isVideo ? 'video-item' : ''}`;
      div.dataset.id = item.id;
      div.dataset.index = index;

      const priceDisplay = item.isVideo ? `R$ ${VIDEO_PRICE.toFixed(2)}` : `R$ ${PHOTO_PRICE.toFixed(2)}`;
      const typeLabel = item.isVideo ? '🎬 VÍDEO' : '📷 FOTO';
      const typeClass = item.isVideo ? 'video' : 'photo';
      
      let imgSrc = item.thumbnail;
      if (item.isVideo) {
        imgSrc = item.thumbnail || item.fallbackThumbnail;
      }

      div.innerHTML = `
        <div class="skeleton" id="skeleton-${index}">
          <div class="spinner"><i class="fas fa-spinner"></i></div>
        </div>
        <div class="badge-status ${isDownloaded ? 'downloaded' : 'locked'}" id="badge-${index}">
          ${isDownloaded ? '<i class="fas fa-unlock"></i> JÁ BAIXADO' : '<i class="fas fa-lock"></i>'}
        </div>
        <div class="type-badge ${typeClass}">${typeLabel}</div>
        <div class="price-tag">${priceDisplay}</div>
        ${item.isVideo ? '<div class="play-icon"><i class="fas fa-play-circle"></i></div>' : ''}
        <img src="${imgSrc}" alt="${item.title}" class="real-image" loading="lazy"
             data-key="${item.key}" data-index="${index}"
             onload="onMediaLoad(${index})"
             onerror="handleImageError(${index}, '${item.fallbackThumbnail || ''}')">
        <img src="https://studiorassi.github.io/home/assets/images/logo/logo_branco.png" alt="Studio Rassi" class="watermark-logo" loading="lazy">
        <div class="watermark-text">Studio Rassi</div>
      `;

      div.addEventListener('click', () => openModal(index));
      grid.appendChild(div);
    });
    
    updateDownloadedDisplay();
    window._galleryLoaded = true;
  }

  function onMediaLoad(index) {
    const img = document.querySelector(`.real-image[data-index="${index}"]`);
    if (img && !img.classList.contains('loaded')) {
      img.classList.add('loaded');
      const skeleton = document.getElementById(`skeleton-${index}`);
      if (skeleton) skeleton.style.display = 'none';

      imagesLoaded++;
      
      if (!window._progressComplete && totalItems > 0) {
        const percent = Math.round((imagesLoaded / totalItems) * 100);
        if (progressFill) progressFill.style.width = percent + '%';
        if (loadedCount) loadedCount.textContent = imagesLoaded;

        if (imagesLoaded >= totalItems) {
          window._progressComplete = true;
          setTimeout(() => {
            if (progressContainer) progressContainer.style.display = 'none';
          }, 400);
        }
      }
    }
  }

  function handleImageError(index, fallbackSrc) {
    const img = document.querySelector(`.real-image[data-index="${index}"]`);
    if (img) {
      if (fallbackSrc) {
        img.src = fallbackSrc;
        img.onerror = null;
      } else {
        img.style.display = 'none';
        const container = img.parentElement;
        const unavailableDiv = document.createElement('div');
        unavailableDiv.style.cssText = `
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          color: #D4A3B3;
          font-size: 0.9rem;
          text-align: center;
          z-index: 10;
          background: rgba(44, 7, 20, 0.8);
          padding: 20px;
          border-radius: 12px;
          border: 1px solid rgba(212, 163, 179, 0.1);
        `;
        unavailableDiv.innerHTML = `
          <i class="fas fa-video" style="font-size: 2rem; display: block; margin-bottom: 8px;"></i>
          ${img.alt || 'Indisponível'}
        `;
        container.appendChild(unavailableDiv);
      }
    }
    onMediaLoad(index);
  }

  // ============================================================
  // FILTROS
  // ============================================================
  let filterButtons = document.querySelectorAll('.filter-btn');

  function setFilter(filter) {
    currentFilter = filter;
    filterButtons.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === filter);
    });
    renderGallery();
  }

  // ============================================================
  // MODAL
  // ============================================================
  async function openModal(index) {
    const filteredItems = currentFilter === 'all' 
      ? allMedia 
      : allMedia.filter(item => item.type === currentFilter);
    
    const realIndex = allMedia.indexOf(filteredItems[index]);
    if (realIndex === -1) return;
    
    currentModalIndex = realIndex;
    const item = allMedia[currentModalIndex];
    const isDownloaded = downloadedItems.includes(item.id);

    modalProgressFill.style.width = '0%';
    modalProgressLabel.textContent = '0%';
    modalProgress.classList.add('show');

    modalImage.style.display = 'none';
    modalVideoContainer.style.display = 'none';
    modalImage.classList.remove('loaded');
    modalImage.style.opacity = '0';
    modalVideo.classList.remove('loaded');
    modalVideoContainer.classList.remove('loaded');

    document.getElementById('currentIndexDisplay').textContent = realIndex + 1;
    modalPriceDisplay.textContent = `R$ ${item.price.toFixed(2)}`;
    modalPriceStrong.textContent = `R$ ${item.price.toFixed(2)}`;
    modalMediaType.textContent = item.isVideo ? '🎬 Vídeo' : '📷 Foto';
    modalMediaType.className = `media-type ${item.isVideo ? 'video' : 'photo'}`;

    updateModalButtons(isDownloaded);
    updateNavButtons();

    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    try {
      let progress = 0;
      const progressInterval = setInterval(() => {
        if (progress < 90) {
          progress += Math.random() * 8;
          if (progress > 90) progress = 90;
          modalProgressFill.style.width = progress + '%';
          modalProgressLabel.textContent = Math.round(progress) + '%';
        }
      }, 100);

      if (item.isVideo) {
        modalVideoContainer.style.display = 'block';
        modalVideoSource.src = item.mediaUrl;
        modalVideo.load();
        
        modalVideo.onloadeddata = function() {
          clearInterval(progressInterval);
          modalProgressFill.style.width = '100%';
          modalProgressLabel.textContent = '100%';
          modalVideoContainer.classList.add('loaded');
          setTimeout(() => modalProgress.classList.remove('show'), 500);
        };
        modalVideo.onerror = function() {
          clearInterval(progressInterval);
          modalProgress.classList.remove('show');
          alert('Erro ao carregar o vídeo. Tente novamente.');
        };
      } else {
        modalImage.style.display = 'block';
        const img = new Image();
        img.onload = function() {
          clearInterval(progressInterval);
          modalProgressFill.style.width = '100%';
          modalProgressLabel.textContent = '100%';
          modalImage.src = item.mediaUrl;
          modalImage.classList.add('loaded');
          modalImage.style.opacity = '1';
          setTimeout(() => modalProgress.classList.remove('show'), 500);
        };
        img.onerror = function() {
          clearInterval(progressInterval);
          modalProgress.classList.remove('show');
          modalImage.alt = 'Erro ao carregar';
        };
        img.src = item.mediaUrl;
      }
    } catch (error) {
      console.error('Erro ao abrir modal:', error);
      modalProgress.classList.remove('show');
    }

    document.addEventListener('keydown', handleModalKeydown);
  }

  function closeModal() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = '';
    document.removeEventListener('keydown', handleModalKeydown);
    if (modalVideo) {
      modalVideo.pause();
    }
  }

  function handleModalKeydown(e) {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') navigateModal(-1);
    if (e.key === 'ArrowRight') navigateModal(1);
  }

  function navigateModal(direction) {
    const newIndex = currentModalIndex + direction;
    if (newIndex >= 0 && newIndex < allMedia.length) {
      const filteredItems = currentFilter === 'all' 
        ? allMedia 
        : allMedia.filter(item => item.type === currentFilter);
      
      const currentFilteredIndex = filteredItems.indexOf(allMedia[currentModalIndex]);
      const newFilteredIndex = currentFilteredIndex + direction;
      
      if (newFilteredIndex >= 0 && newFilteredIndex < filteredItems.length) {
        const newRealIndex = allMedia.indexOf(filteredItems[newFilteredIndex]);
        if (newRealIndex !== -1) {
          openModal(newFilteredIndex);
        }
      }
    }
  }

  function updateNavButtons() {
    const prevBtn = document.getElementById('modalPrev');
    const nextBtn = document.getElementById('modalNext');
    if (prevBtn) {
      prevBtn.disabled = currentModalIndex === 0;
      prevBtn.style.opacity = currentModalIndex === 0 ? '0.3' : '1';
    }
    if (nextBtn) {
      nextBtn.disabled = currentModalIndex === allMedia.length - 1;
      nextBtn.style.opacity = currentModalIndex === allMedia.length - 1 ? '0.3' : '1';
    }
  }

  // ============================================================
  // 🔥 DOWNLOAD DO ARQUIVO
  // ============================================================
  async function downloadMedia(item) {
    try {
      const viewRes = await fetch(`${API_BASE_URL}/api/gallery/view/${item.key}`);
      const downloadUrl = viewRes.url || `${API_BASE_URL}/api/gallery/view/${item.key}`;

      const filename = item.key.split('/').pop();
      
      const response = await fetch(downloadUrl);
      const blob = await response.blob();
      let mimeType = item.isVideo ? 'video/mp4' : 'image/jpeg';
      const blobWithType = new Blob([blob], { type: mimeType });
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blobWithType);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      setTimeout(() => {
        URL.revokeObjectURL(link.href);
      }, 5000);
      
      console.log(`✅ Download iniciado: ${filename}`);
      
    } catch (error) {
      console.error('❌ Erro no download:', error);
      alert('❌ Erro ao baixar o arquivo. Tente novamente.');
    }
  }

  // ============================================================
  // 🔥 COMPRA - COM CÓDIGO DE CONFIRMAÇÃO
  // ============================================================
  function buyMedia() {
    const item = allMedia[currentModalIndex];
    if (!item) return;

    if (downloadedItems.includes(item.id)) {
      alert('✅ Este item já foi baixado.');
      return;
    }

    const priceDisplay = item.isVideo ? `R$ ${VIDEO_PRICE.toFixed(2)}` : `R$ ${PHOTO_PRICE.toFixed(2)}`;
    const typeName = item.isVideo ? 'vídeo' : 'foto';
    const paymentUrl = item.isVideo ? MP_URL_VIDEO : MP_URL_PHOTO;
    
    const codigoConfirmacao = gerarCodigoConfirmacao();
    
    pendingPurchase = {
      id: item.id,
      type: item.type,
      key: item.key,
      title: item.title,
      price: item.price,
      timestamp: Date.now(),
      codigo: codigoConfirmacao
    };
    localStorage.setItem('pendingMedia', JSON.stringify(pendingPurchase));

    const confirmMsg = 
      `🛒 Você está comprando ${typeName} "${item.title}" por ${priceDisplay}.\n\n` +
      `📌 CÓDIGO DE CONFIRMAÇÃO: ${codigoConfirmacao}\n\n` +
      `🔗 Clique em OK para ir para o pagamento (Mercado Pago).\n\n` +
      `⚠️ GUARDE O CÓDIGO ACIMA!\n` +
      `Após o pagamento, você precisará deste código para liberar o download.`;

    if (confirm(confirmMsg)) {
      window.open(paymentUrl, '_blank');
      
      if (modalBuyBtn) {
        modalBuyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Aguardando pagamento...';
        modalBuyBtn.style.background = '#FFD700';
        modalBuyBtn.style.color = '#2C0714';
        modalBuyBtn.disabled = true;
      }
      
      updatePaymentStatus(`⏳ Código: ${codigoConfirmacao} - Aguardando pagamento`, 'warning');
      
      setTimeout(() => {
        updatePaymentStatus(`💡 Código: ${codigoConfirmacao} - Após pagar, informe o código`, 'info');
      }, 2000);

      alert(
        `📌 GUARDE ESTE CÓDIGO:\n\n` +
        `🔐 ${codigoConfirmacao}\n\n` +
        `Após realizar o pagamento, clique em "Já realizei o pagamento" e informe este código.\n\n` +
        `⚠️ Não compartilhe este código com ninguém!`
      );

      console.log(`📊 Intenção de compra: ${item.type} - ${item.title} - ${priceDisplay}`);
      console.log(`🔗 Link: ${paymentUrl}`);
      console.log(`🔐 Código: ${codigoConfirmacao}`);
    }
  }

  // ============================================================
  // 🔥 CONFIRMAR PAGAMENTO - COM VALIDAÇÃO DE CÓDIGO
  // ============================================================
  function confirmPayment() {
    const item = allMedia[currentModalIndex];
    if (!item) return;

    if (downloadedItems.includes(item.id)) {
      alert('✅ Este item já foi baixado.');
      return;
    }

    const pendingData = localStorage.getItem('pendingMedia');
    
    if (!pendingData) {
      alert('ℹ️ Nenhum pagamento pendente encontrado.\n\nVocê precisa primeiro clicar em "Comprar" para gerar um pagamento.');
      return;
    }

    try {
      const pending = JSON.parse(pendingData);
      
      if (pending.id !== item.id) {
        const confirmar = confirm(
          `⚠️ Você tem um pagamento pendente para "${pending.title}" (${pending.type}).\n\n` +
          `Deseja liberar este item "${item.title}" no lugar?`
        );
        if (!confirmar) return;
        
        pending.id = item.id;
        pending.type = item.type;
        pending.title = item.title;
        pending.key = item.key;
        pending.price = item.price;
        localStorage.setItem('pendingMedia', JSON.stringify(pending));
      }

      // 🔥 SOLICITA O CÓDIGO DE CONFIRMAÇÃO
      const codigoInformado = prompt(
        `🔐 Para confirmar o pagamento de "${item.title}" (${item.type}), digite o código de confirmação:\n\n` +
        `📌 Seu código: ${pending.codigo || 'Não definido'}\n\n` +
        `⚠️ Este código foi mostrado na hora da compra.\n` +
        `Se você não tem o código, aguarde a confirmação manual do administrador.`
      );

      if (!codigoInformado) {
        alert('❌ Confirmação cancelada.');
        return;
      }

      // 🔥 VERIFICA O CÓDIGO
      if (codigoInformado !== pending.codigo) {
        alert(`❌ Código de confirmação inválido!\n\nCódigo correto: ${pending.codigo}\n\nTente novamente ou aguarde a confirmação manual.`);
        return;
      }

      // 🔥 CÓDIGO VÁLIDO - LIBERA O DOWNLOAD
      if (!downloadedItems.includes(item.id)) {
        downloadedItems.push(item.id);
        localStorage.setItem('downloadedMedia', JSON.stringify(downloadedItems));
        
        updateDownloadBadge(item.id);
        updateDownloadedDisplay();
        updateModalButtons(true);
        
        localStorage.removeItem('pendingMedia');
        pendingPurchase = null;
        
        downloadMedia(item);
        
        alert(`✅ Pagamento confirmado! "${item.title}" liberado para download.\n\nO download será iniciado automaticamente.`);
        
        const btn = document.getElementById('modalConfirmPaymentBtn');
        if (btn) {
          btn.innerHTML = '<i class="fas fa-check-circle"></i> Pagamento confirmado!';
          btn.style.background = '#2E7D32';
          btn.style.color = '#ffffff';
          btn.disabled = true;
        }
        
        updatePaymentStatus('✅ Pagamento confirmado! Download iniciado', 'success');
      }
      
    } catch (error) {
      console.error('❌ Erro ao confirmar pagamento:', error);
      alert('❌ Erro ao verificar o pagamento. Tente novamente.');
    }
  }

  // ============================================================
  // 🔥 VERIFICAÇÃO DE PAGAMENTO PENDENTE
  // ============================================================
  function checkPendingPurchase() {
    const pending = localStorage.getItem('pendingMedia');
    if (pending) {
      try {
        const data = JSON.parse(pending);
        if (Date.now() - data.timestamp > 2 * 60 * 60 * 1000) {
          localStorage.removeItem('pendingMedia');
          pendingPurchase = null;
          if (paymentStatus) {
            paymentStatus.textContent = '⏰ Pedido expirado (2h)';
            paymentStatus.style.color = '#ff6b6b';
          }
        } else {
          pendingPurchase = data;
          if (paymentStatus && modalOverlay.classList.contains('active')) {
            paymentStatus.textContent = `⏳ Código: ${data.codigo} - Aguardando confirmação`;
            paymentStatus.style.color = '#FFD700';
          }
        }
      } catch (e) {
        localStorage.removeItem('pendingMedia');
      }
    }
  }

  // ============================================================
  // MENU MOBILE
  // ============================================================
  function toggleMobileMenu() {
    if (!mobileMenu || !hamburgerBtn || !navbar) return;
    mobileMenu.classList.toggle('open');
    hamburgerBtn.classList.toggle('active');
    if (mobileMenu.classList.contains('open')) {
      navbar.classList.add('hidden');
      document.body.style.overflow = 'hidden';
    } else {
      navbar.classList.remove('hidden');
      document.body.style.overflow = '';
    }
  }

  function closeMobileMenu() {
    if (!mobileMenu || !hamburgerBtn || !navbar) return;
    mobileMenu.classList.remove('open');
    hamburgerBtn.classList.remove('active');
    navbar.classList.remove('hidden');
    document.body.style.overflow = '';
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  if (hamburgerBtn) hamburgerBtn.addEventListener('click', toggleMobileMenu);

  // ============================================================
  // BLOQUEIOS DE SEGURANÇA
  // ============================================================
  document.addEventListener('keydown', function(e) {
    if (e.key === 'PrintScreen' || (e.ctrlKey && e.key === 'p')) {
      e.preventDefault();
      alert('🔒 A proteção de conteúdo está ativa.');
    }
  });

  document.addEventListener('contextmenu', function(e) {
    if (e.target.closest('.watermark-item') || e.target.closest('.modal-overlay')) {
      e.preventDefault();
      alert('🔒 Clique direito bloqueado.');
    }
  });

  // ============================================================
  // NAVBAR SCROLL
  // ============================================================
  window.addEventListener('scroll', function() {
    if (!navbar) return;
    if (window.scrollY > 50) {
      navbar.classList.add('scrolled');
    } else {
      navbar.classList.remove('scrolled');
    }
  });

  // ============================================================
  // INICIALIZAÇÃO
  // ============================================================
  async function init() {
    await loadMediaFromS3();
    checkPendingPurchase();
    setInterval(checkPendingPurchase, 10000);

    console.log('📸 Galeria de Fotos e Vídeos carregada!');
    console.log(`📊 ${allMedia.filter(m => m.type === 'foto').length} fotos (R$ ${PHOTO_PRICE.toFixed(2)})`);
    console.log(`🎬 ${allMedia.filter(m => m.type === 'video').length} vídeos (R$ ${VIDEO_PRICE.toFixed(2)})`);
    console.log(`📥 ${downloadedItems.length} itens já baixados`);
    console.log('🔐 Sistema de confirmação com código ativo!');
  }

  init();
</script>

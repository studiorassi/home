<!-- admin-login.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · Studio Rassi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2C0714;
      color: #f5edea;
      font-family: 'Work Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: #1f0510;
      border-radius: 32px;
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      border: 1px solid rgba(212, 163, 179, 0.08);
    }
    .login-box h1 {
      font-family: 'Fraunces', serif;
      text-align: center;
      margin-bottom: 4px;
    }
    .login-box .subtitle {
      text-align: center;
      color: #d4c5c0;
      font-weight: 300;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }
    .login-box .input-group {
      margin-bottom: 16px;
    }
    .login-box label {
      display: block;
      font-size: 0.8rem;
      color: #d4c5c0;
      margin-bottom: 4px;
    }
    .login-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 40px;
      border: 1px solid rgba(212, 163, 179, 0.12);
      background: #2C0714;
      color: #f5edea;
      font-family: 'Work Sans', sans-serif;
      font-size: 0.95rem;
    }
    .login-box input:focus {
      outline: none;
      border-color: #D4A3B3;
    }
    .login-box .btn-login {
      width: 100%;
      padding: 14px;
      background: #D4A3B3;
      color: #2C0714;
      border: none;
      border-radius: 40px;
      font-family: 'Work Sans', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 8px;
    }
    .login-box .btn-login:hover {
      background: #c08b9e;
      transform: translateY(-2px);
    }
    .login-box .error-msg {
      color: #e74c3c;
      text-align: center;
      margin-top: 12px;
      font-size: 0.85rem;
      display: none;
    }
    .login-box .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>🔐 Admin</h1>
    <p class="subtitle">Studio Rassi · Painel de Controle</p>
    <form id="adminLoginForm">
      <div class="input-group">
        <label>Usuário</label>
        <input type="text" id="adminUser" placeholder="Digite o usuário admin">
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="adminPass" placeholder="Digite a senha admin">
      </div>
      <button type="submit" class="btn-login">Entrar</button>
      <div class="error-msg" id="adminError">Credenciais inválidas</div>
    </form>
  </div>

  <script>
    // Credenciais do admin (ideal: armazenar no backend)
    const ADMIN_USER = 'admin';
    const ADMIN_PASS = 'studio2026';

    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('adminUser').value.trim();
      const pass = document.getElementById('adminPass').value.trim();
      const error = document.getElementById('adminError');

      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        localStorage.setItem('authToken', 'admin-token-simples');
        window.location.href = 'dashboard.html';
      } else {
        error.textContent = '❌ Usuário ou senha incorretos';
        error.classList.add('show');
        document.getElementById('adminUser').value = '';
        document.getElementById('adminPass').value = '';
        document.getElementById('adminUser').focus();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Pendente · Studio Rassi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2C0714;
      color: #f5edea;
      font-family: 'Work Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      text-align: center;
      background: #1f0510;
      padding: 48px 32px;
      border-radius: 28px;
      border: 1px solid rgba(212, 163, 179, 0.1);
    }
    .icon {
      font-size: 4rem;
      color: #f39c12;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      margin-bottom: 8px;
    }
    p {
      color: #d4c5c0;
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      background: #D4A3B3;
      color: #2C0714;
      padding: 12px 32px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(212, 163, 179, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><i class="fas fa-clock"></i></div>
    <h1>⏳ Pagamento Pendente</h1>
    <p>Seu pagamento está sendo processado.<br>
    Em breve você receberá a confirmação por e-mail.</p>
    <a href="https://studiorassi.github.io/home/index.html" class="btn">
      <i class="fas fa-arrow-left"></i> Voltar para o site
    </a>
  </div>
</body>
</html>
